name: verify
on:
  pull_request:
  push:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: clears_spend_test
          POSTGRES_USER: clears_spend
          POSTGRES_PASSWORD: clears_spend
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clears_spend -d clears_spend_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://clears_spend:clears_spend@localhost:5432/clears_spend_test
      PROCRASTINATE_DATABASE_URL: postgresql://clears_spend:clears_spend@localhost:5432/clears_spend_test
      RUN_DATABASE_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.13", enable-cache: true }
      - run: uv sync --directory services/backend --all-extras --frozen
      - run: uv run --directory services/backend alembic upgrade head
      - run: uv run --directory services/backend ruff check app tests alembic
      - run: uv run --directory services/backend mypy app tests
      - run: uv run --directory services/backend pytest
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.19.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, cache-dependency-path: apps/web/pnpm-lock.yaml }
      - run: pnpm --dir apps/web install --frozen-lockfile
      - run: pnpm --dir apps/web lint
      - run: pnpm --dir apps/web typecheck
      - run: pnpm --dir apps/web test
      - run: pnpm --dir apps/web build
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.13", enable-cache: true }
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose up --build -d
      - run: uv sync --directory services/backend --all-extras --frozen
      - run: curl --fail --retry 60 --retry-delay 1 --retry-connrefused http://localhost:8000/health/ready
      - run: uv run --directory services/backend python ../../scripts/smoke.py
      - if: always()
        run: docker compose logs --no-color api worker web minio clamav
      - if: always()
        run: docker compose down --volumes
