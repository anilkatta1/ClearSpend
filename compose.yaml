name: clears-spend
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: clears_spend
      POSTGRES_USER: clears_spend
      POSTGRES_PASSWORD: clears_spend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clears_spend -d clears_spend"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: clears_spend
      MINIO_ROOT_PASSWORD: clears_spend_dev_secret
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - receipt_objects:/data

  clamav:
    image: clamav/clamav:1.4.6
    platform: linux/amd64
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "1"]
      interval: 10s
      timeout: 5s
      retries: 30
    volumes:
      - clamav_signatures:/var/lib/clamav

  migrate:
    build: ./services/backend
    env_file: .env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    build: ./services/backend
    env_file: .env
    command: ["python", "-m", "app.seed"]
    depends_on:
      jobschema:
        condition: service_completed_successfully

  jobschema:
    build: ./services/backend
    env_file: .env
    environment:
      PROCRASTINATE_APP: app.jobs.procrastinate_app
    command: ["sh", "-c", "procrastinate healthchecks >/dev/null 2>&1 || procrastinate schema --apply"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build: ./services/backend
    env_file: .env
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["8000:8000"]
    depends_on:
      seed:
        condition: service_completed_successfully
      minio:
        condition: service_started
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build: ./services/backend
    env_file: .env
    command: ["python", "-m", "app.worker"]
    depends_on:
      seed:
        condition: service_completed_successfully
      minio:
        condition: service_started
      clamav:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      args:
        API_BASE_URL: http://api:8000
    environment:
      API_BASE_URL: http://api:8000
    ports: ["3000:3000"]
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  receipt_objects:
  clamav_signatures:
